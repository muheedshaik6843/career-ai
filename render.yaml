services:
  - type: web
    name: career-ai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvcorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: career-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://career-ai-api-lmbh.onrender.com/api/v1/auth/google/callback"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://career-ai-git-main-muheedshaik6843s-projects.vercel.app", "https://career-myihiwz6g-muheedshaik6843s-projects.vercel.app", "https://career-ai-five-eta.vercel.app"]'

databases:
  - name: career-ai-db
    databaseName: career_ai
    user: career_ai
    plan: free
# Auto-deploy trigger: v3 CORS fix for production Vercel URL